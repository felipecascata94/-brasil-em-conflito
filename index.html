<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Brasil em Conflito — Beta Grátis</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080808;color:#fff;font-family:Arial,sans-serif;touch-action:none}
#game{position:fixed;inset:0;width:100%;height:100%;image-rendering:auto}
#hud{position:fixed;top:env(safe-area-inset-top,10px);left:0;right:0;padding:10px;display:flex;justify-content:space-between;pointer-events:none;text-shadow:0 2px 3px #000;font-weight:bold}
.panel{background:#0008;border:1px solid #fff3;border-radius:10px;padding:7px 10px;font-size:13px}
#mission{position:fixed;top:64px;left:50%;transform:translateX(-50%);background:#000b;padding:8px 12px;border-radius:12px;font-size:13px;pointer-events:none;text-align:center}
#cross{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);font-size:22px;pointer-events:none}
#joystick{position:fixed;left:18px;bottom:25px;width:125px;height:125px;border:2px solid #ffffff55;border-radius:50%;background:#ffffff0d}
#stick{position:absolute;width:54px;height:54px;left:33px;top:33px;border-radius:50%;background:#fff4;border:1px solid #fff7}
.btn{position:fixed;border:1px solid #fff5;background:#0009;color:white;border-radius:50%;width:72px;height:72px;font-weight:bold;font-size:12px}
#fire{right:24px;bottom:32px;background:#b51f1fbb}
#cam{right:105px;bottom:115px;width:62px;height:62px}
#sprint{right:24px;bottom:120px;width:62px;height:62px}
#start{position:fixed;inset:0;background:linear-gradient(#000c,#000e),radial-gradient(circle at center,#4a1b0b,#050505);display:flex;align-items:center;justify-content:center;padding:25px;text-align:center}
.card{max-width:420px;background:#111e;border:1px solid #fff3;border-radius:20px;padding:25px;box-shadow:0 15px 50px #000}
h1{margin:0 0 8px;font-size:28px}.sub{color:#bbb;margin-bottom:20px}
#play{border:0;border-radius:14px;padding:15px 25px;font-size:17px;font-weight:bold;background:#fff;color:#111}
small{display:block;color:#888;margin-top:14px}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
 <div class="panel">❤️ <span id="hp">100</span> &nbsp; 🔫 <span id="ammo">12</span></div>
 <div class="panel">🚨 ALERTA <span id="alert">0%</span></div>
</div>
<div id="mission">MISSÃO: chegue ao ponto amarelo</div>
<div id="cross">+</div>
<div id="joystick"><div id="stick"></div></div>
<button class="btn" id="fire">ATIRAR</button>
<button class="btn" id="cam">1ª/3ª</button>
<button class="btn" id="sprint">CORRER</button>
<div id="start"><div class="card">
<h1>BRASIL EM CONFLITO</h1>
<div class="sub">Beta grátis • protótipo jogável para celular</div>
<p>Explore uma zona urbana fictícia inspirada no Rio. Fações, policiais e personagens são fictícios.</p>
<button id="play">JOGAR AGORA</button>
<small>Feito para testar a jogabilidade no iPhone.</small>
</div></div>

<script>
const c=document.getElementById('game'),ctx=c.getContext('2d');
let W=320,H=180,scale=1,started=false,third=false,sprint=false,hp=100,ammo=12,alert=0;
let p={x:2.2,y:2.2,a:0}, goal={x:12.5,y:10.5};
const map=[
"1111111111111111",
"1000000000000001",
"1011110111111101",
"1000010000000101",
"1011010111110101",
"1001000100010001",
"1101011101011101",
"1001000001000001",
"1011110111110101",
"1000000100010001",
"1011111101011101",
"1000000000000001",
"1111111111111111"];
function resize(){W=innerWidth<700?360:520;H=Math.round(W*9/16);c.width=W;c.height=H}addEventListener('resize',resize);resize();
function wall(x,y){return y<0||y>=map.length||x<0||x>=map[0].length||map[y][x]=='1'}
function move(dx,dy){let nx=p.x+dx,ny=p.y+dy;if(!wall(Math.floor(nx),Math.floor(p.y)))p.x=nx;if(!wall(Math.floor(p.x),Math.floor(ny)))p.y=ny}
function cast(a){let x=p.x,y=p.y,dx=Math.cos(a),dy=Math.sin(a),d=0;while(d<20){x+=dx*.045;y+=dy*.045;d+=.045;if(wall(Math.floor(x),Math.floor(y)))return d}return 20}
let keys={};onkeydown=e=>keys[e.key.toLowerCase()]=true;onkeyup=e=>keys[e.key.toLowerCase()]=false;
let joy={x:0,y:0},drag=false;
const j=document.getElementById('joystick'),st=document.getElementById('stick');
function joyMove(e){let r=j.getBoundingClientRect(),x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2,m=Math.min(45,Math.hypot(x,y)),a=Math.atan2(y,x);joy.x=Math.cos(a)*m/45;joy.y=Math.sin(a)*m/45;st.style.transform=`translate(${joy.x*35}px,${joy.y*35}px)`}
j.addEventListener('pointerdown',e=>{drag=true;j.setPointerCapture(e.pointerId);joyMove(e)});j.addEventListener('pointermove',e=>drag&&joyMove(e));j.addEventListener('pointerup',()=>{drag=false;joy={x:0,y:0};st.style.transform='none'});
let look=false,lastX=0; c.addEventListener('pointerdown',e=>{if(e.clientX>innerWidth*.45){look=true;lastX=e.clientX}});c.addEventListener('pointermove',e=>{if(look){p.a+=(e.clientX-lastX)*.008;lastX=e.clientX}});c.addEventListener('pointerup',()=>look=false);
document.getElementById('sprint').onpointerdown=()=>sprint=true;document.getElementById('sprint').onpointerup=()=>sprint=false;
document.getElementById('cam').onclick=()=>third=!third;
document.getElementById('fire').onclick=shoot;
function shoot(){if(!started||ammo<=0)return;ammo--;alert=Math.min(100,alert+7);document.getElementById('ammo').textContent=ammo; if(ammo===0)setTimeout(()=>{ammo=12;document.getElementById('ammo').textContent=ammo},1200)}
function draw3d(){
ctx.fillStyle='#82a8b5';ctx.fillRect(0,0,W,H/2);ctx.fillStyle='#343434';ctx.fillRect(0,H/2,W,H/2);
let fov=Math.PI/3,cols=W;
for(let x=0;x<cols;x++){let a=p.a-fov/2+fov*x/cols,d=cast(a)*Math.cos(a-p.a),h=Math.min(H*1.8,H/(d*.75)),top=H/2-h/2;
let shade=Math.max(25,150-d*9);ctx.fillStyle=`rgb(${shade},${shade},${shade})`;ctx.fillRect(x,top,1,h)}
// goal marker
let gx=goal.x-p.x,gy=goal.y-p.y,ang=Math.atan2(gy,gx)-p.a;while(ang>Math.PI)ang-=2*Math.PI;while(ang<-Math.PI)ang+=2*Math.PI;
if(Math.abs(ang)<fov/2){let sx=W/2+ang/(fov/2)*(W/2),d=Math.hypot(gx,gy),sz=Math.max(8,80/d);ctx.fillStyle='#ffd43b';ctx.fillRect(sx-sz/2,H/2-sz*2,sz,sz*2)}
// crosshair and weapon
if(third){ctx.fillStyle='#111';ctx.beginPath();ctx.arc(W/2,H*.63,12,0,7);ctx.fill();ctx.fillStyle='#555';ctx.fillRect(W/2-5,H*.64,10,30)}
}
function update(){
if(!started)return;
let sp=(sprint?0.075:0.045),forward=-joy.y,side=joy.x;
if(keys.w)forward=1;if(keys.s)forward=-1;if(keys.a)side=-1;if(keys.d)side=1;
move(Math.cos(p.a)*forward*sp+Math.cos(p.a+Math.PI/2)*side*sp,Math.sin(p.a)*forward*sp+Math.sin(p.a+Math.PI/2)*side*sp);
if(keys.arrowleft)p.a-=.035;if(keys.arrowright)p.a+=.035;
alert=Math.max(0,alert-.025);document.getElementById('alert').textContent=Math.round(alert)+'%';
document.getElementById('hp').textContent=hp;
if(Math.hypot(p.x-goal.x,p.y-goal.y)<.65){document.getElementById('mission').textContent='MISSÃO CONCLUÍDA ✓  •  Explore o mapa e teste o combate';goal={x:2.5,y:10.5}}
}
function loop(){update();ctx.clearRect(0,0,W,H);draw3d();requestAnimationFrame(loop)}loop();
document.getElementById('play').onclick=()=>{started=true;document.getElementById('start').style.display='none'}
</script>
</body></html>
